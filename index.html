<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LIGHT, matching tokens.css's light polarity (--rehab-ground: #f3f5f7).
         Leaving this unset, or set to "dark", makes the UA paint dark native
         scrollbars and form controls against this light UI and flashes the
         wrong chrome before CSS lands. Update this comment (and the value)
         together if tokens.css's polarity ever changes again — it did once,
         on 2026-08-21, and this line silently kept the old rationale for
         days after. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Rehabibi — a private, real-time computer-vision rehab coach that runs entirely in your browser. No video ever leaves your device. 智慧居家復健教練，姿態偵測完全於瀏覽器內執行，影像不上傳、不儲存。"
    />
    <!-- Inline data URI, not a file: invariant #1 forbids a remote request from a
         rehab surface, and this also stops a /favicon.ico 404 on every load.
         Ground #005fc6 (--rehab-blue-deep), mark white — a raised arm. Deep,
         not plain blue, because white-on-plain-blue fails contrast (see
         DESIGN.md's two-tier accent rule); a favicon stays a bold color block
         at 16px regardless of the app's own light polarity. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%23005fc6%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%2017h8%22%2F%3E%3Cpath%20d%3D%22M9%2017V9l6-4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
    <title>Rehabibi — Intelligent Home Rehabilitation Coach</title>
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
