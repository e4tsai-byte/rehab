[project]
name = "pose-coach"
version = "0.1.0"
description = "Pose tracking + exercise-state classification PoC for the PHIT camera-based strength coach (single-person sit-to-stand SEATED/STANDING/TRANSITIONING/UNKNOWN classification)."
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pose_coach*"]
